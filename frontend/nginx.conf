# nginx del FRONTEND: es solo el servidor web del front (no es un balanceador).
# 1) Sirve los archivos estáticos que generó "npm run build" (carpeta dist/).
# 2) Hace de proxy de /api/ y /graphql hacia core-service: el navegador habla con un
#    solo origen (http://localhost:3000), así que no hay problemas de CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core-service:8080;
        proxy_set_header Host $host;
    }

    location /graphql {
        proxy_pass http://core-service:8080;
        proxy_set_header Host $host;
    }

    # react-router: cualquier ruta que no sea un archivo devuelve index.html
    # (así funciona recargar la página en /citas, /alertas, etc.)
    location / {
        try_files $uri /index.html;
    }
}
